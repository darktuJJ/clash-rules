# iRingo Siri - https://github.com/NSRingo/Siri/releases/latest/download/iRingo.Siri.sgmodule
# iRingo 天气 - https://github.com/NSRingo/WeatherKit/releases/latest/download/iRingo.WeatherKit.sgmodule
