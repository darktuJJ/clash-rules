# ==============================================================
# Surge 托管配置模板（iOS / macOS 通用）
# 仓库：https://github.com/darktuJJ/clash-surge-rules
# 策略组与规则对齐本仓库的 Clash 模板 ACL4SSR_Online_Full_WithIcon.yaml，
# 并移植了 Clash Party 个人覆写里的通用部分（AI专线、Cursor链路、STUN 拦截、AI/Cursor 域名等）。
# [General] / [Host] / [URL Rewrite] / [Script] / [MITM] 基于 TributePaulWalker/Profiles 的 Surge Pro.conf 修改。
#
# 本文件是「模板」，不包含任何私人信息：
# - 节点由 Sub-Store 文件脚本把 [Proxy] 里的占位符替换成真实节点；
# - #!MANAGED-CONFIG 首行也由 Sub-Store 脚本自动加上；
# - 规则集全部使用 raw.githubusercontent.com 地址（ACL4SSR 的 Clash .list 与 Surge 规则集格式兼容）；
# - 私人规则（DDNS 域名、内网网段等）请放进本地模块，见 本地模块示例.sgmodule。
#   注意：模块里的规则只能用 DIRECT / REJECT，指定某个节点的私人规则无法放进模块。
#
# 官方手册 - https://manual.nssurge.com/
# 理解原理 - https://manual.nssurge.com/book/understanding-surge/cn/
# 常见问题 - https://nssurge.zendesk.com/
# 社区论坛 - https://community.nssurge.com
# ==============================================================

