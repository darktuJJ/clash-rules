[MITM]
# 校验服务器证书
skip-server-cert-verify = false

# MITM over HTTP/2
h2 = true

hostname = duckduckgo.com, sub.store

# CA 证书请在每台设备上用 Surge 本地生成并安装信任（「HTTPS 解密」→「生成新的 CA 证书」）。
# ca-passphrase / ca-p12 是私密信息，只能存在设备本地（Surge 会写进本地配置或本地模块），
