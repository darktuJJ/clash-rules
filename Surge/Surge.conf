[Rule]
# 规则顺序：QUIC 拦截 → 个人覆写移植部分（拦截 → 进程 → 直连 → AI → Cursor → 其他代理）→ 少量 Surge 自用 → ACL4SSR 规则集（顺序与 Clash 模板一致）→ GEOIP → FINAL

# ========== 0. 基础 ==========
# 拒绝 QUIC（UDP 443），让 HTTP/3 回落到 TCP（对应 Clash 覆写「DNS与QUIC防护」）
AND,((PROTOCOL,UDP), (DEST-PORT,443)),REJECT-NO-DROP
# NTP 时间同步直连
DEST-PORT,123,DIRECT

# ========== 1. 拦截 ==========
# WebRTC 防泄漏：谷歌云节点未开 UDP 前，STUN 会回落 DIRECT 暴露真实 IP
AND,((PROTOCOL,UDP), (DEST-PORT,3478)),REJECT
AND,((PROTOCOL,UDP), (DEST-PORT,19302)),REJECT

# ========== 2. 进程 ==========
# PROCESS-NAME,Grok Bot.exe 是 Windows 进程名，Surge 不支持；macOS 上进程名未核实，需要时在 Mac 本地确认后自行启用：
# PROCESS-NAME,Grok Bot,Cursor链路

